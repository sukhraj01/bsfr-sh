[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsfr-sh"
version = "0.1.0"
description = "From-scratch implementation, re-evaluation and repair of BSFR-SH (Wazid, Das & Shetty, IEEE TCE 2023)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sukhraj01" }]
keywords = ["blockchain", "pbft", "ransomware", "smart-healthcare", "reproduction"]

# Runtime dependencies stay minimal by CLAUDE.md §6. `cryptography` is declared here because
# every candidate answer to Q1 (ECDSA backend) needs a baseline to be benchmarked against in M1;
# declaring it is not choosing it. No code in this repo imports it yet.
dependencies = [
    "cryptography>=42",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    # Already an indirect dependency of scikit-learn; declared directly starting M7-7, which is
    # the first code to import it itself (`scipy.stats.ks_2samp`, synthetic-vs-real distribution
    # comparison) rather than relying on scikit-learn's own use of it.
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",  # required for `mypy --strict` to type yaml.safe_load
    # Benchmark-only, and deliberately not a runtime dependency. M1 measured it against
    # `cryptography` to close Q1 (pure Python lost by 17x on sign and 40x on verify, see
    # RESULTS.md); it is kept so `scripts/bench_ecdsa_backends.py` stays re-runnable and the
    # decision stays checkable rather than remembered.
    "ecdsa>=0.19",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bsfr_sh = ["py.typed"]

# --------------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------------
# `make test` runs tests/unit only (fast loop). `make test-all` runs everything.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a second; excluded from the fast loop",
    "integration: crosses a module boundary; lives in tests/integration",
]

# --------------------------------------------------------------------------------------------
# ruff  (configured here, not in a separate ruff.toml — CLAUDE.md §7)
# --------------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle — E722 is the "no bare except" rule from CLAUDE.md §7
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "T20",       # flake8-print — enforces "no print, use util.logging" (CLAUDE.md §7)
    "RET",       # return simplification
    "SIM",       # simplification
    "PTH",       # prefer pathlib
    "ANN",       # missing type annotations (CLAUDE.md §7: type hints everywhere)
    "ARG",       # unused arguments
    "TID",       # tidy imports
    "RUF",
]
ignore = [
    "ANN401",  # explicit Any is unavoidable at the YAML boundary
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on internals and take fixtures they do not annotate.
"tests/**" = ["ANN", "ARG", "SIM117"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------------------------
# mypy  (strict over src/, per CLAUDE.md §7)
# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Added in M4a, when the import actually appeared. scikit-learn ships no `py.typed` marker, so
# `mypy --strict` cannot see its types at all. The scope is deliberately one library: estimators
# are reached through `detection/models.py`, which annotates every value that crosses back into
# our code, so the untyped region stops at that wrapper.
[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*"]
ignore_missing_imports = true

# Added in M6a, when bench/emit.py started plotting. Same shape as the scikit-learn override
# above: matplotlib ships no py.typed marker, and the untyped region stops at emit.py, which
# annotates every value that crosses back into our code.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# Added closing D2, when bench_ecdsa_backends' logic moved from scripts/ (never linted) into
# bench/ecdsa_backends.py (now covered by `mypy --strict`). Same shape as the overrides above:
# the pure-Python `ecdsa` package ships no `py.typed` marker, and the untyped region stops at
# `bench.ecdsa_backends.bench_pure_python`, which annotates every value crossing back into ours.
[[tool.mypy.overrides]]
module = ["ecdsa.*"]
ignore_missing_imports = true

# Added in M7-7, when honeypot/distribution_compare.py started calling scipy.stats.ks_2samp.
# Same shape as the overrides above: scipy ships no bundled type stubs for mypy to read, and the
# untyped region stops at that module's own return type annotations.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
