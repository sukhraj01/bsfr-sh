# Benchmark harness configuration (M6).
#
# See configs/chain.yaml for the PAPER / DERIVED / DECLARED convention.
#
# Nothing here duplicates chain.yaml. Case block counts and transactions-per-block live there;
# this file only names which of them to run.

kind: bench
schema_version: 1

run:
  cases: [case_1, case_2, case_3]   # resolved against chain.yaml `cases`
  chains: [BC_DTBU, BC_SigRW]       # PAPER §VII — both chains benchmarked separately

timing:
  repeats: 5                        # DECLARED — docs/EXPERIMENTS.md protocol: median of N >= 5.
                                    #   The paper reports a single unqualified number per case.
  warmup_runs: 1                    # DECLARED — discarded, never folded into the median
  aggregate: median                 # never mean: one slow run must not move the number
  clock: perf_counter               # DECLARED — monotonic, highest available resolution
  # CLAUDE.md §4: the measured span is block construction + consensus + append. Nothing else is
  # inside the timer.
  measure_span: [block_construction, consensus, append]

  # DEV-05's backup index is OURS; the paper's design has no index. Timing it inside the span
  # above would compare our indexed append against their unindexed one, which is not the
  # comparison Fig. 6(a) claims to make. `framework.phase1_backup.run()` therefore does no index
  # work at all, and `maintain_index()` is a separate call. M6 reports it as its own column when
  # it reports it, and never folds it into a Target 3 number.
  index_maintenance: separate_column

# Network latency and Target 3 (DEV-21) — read before interpreting any Fig. 6 number.
#
# The consensus bus has a per-message delay, `consensus.message_delay_s` in chain.yaml, default
# 0.0. It lives there, not here, because it is a property of the modelled network, not of the
# harness. What it does to Target 3:
#
#   * delay = 0 (default): instant delivery. Wall-clock around `consensus` is pure compute —
#     ECDSA sign/verify over 32-byte digests, hashing, chain validation — on the order of 1 ms per
#     100-tx block against the paper's ~380 ms. Fig. 6's shape is then dominated by hybrid
#     encryption during block construction, not by consensus. Defensible, but it is a different
#     claim from the paper's, and the write-up must say so.
#   * delay = d > 0: the bus runs on a SIMULATED clock and never sleeps, so wall-clock does not
#     change. The modelled network cost is read from the bus clock (`network.now`): about 3d per
#     committed block (pre-prepare -> prepare -> commit), serial, because one height is in flight
#     at a time (DEV-20).
#
# M6 runs both and reports measured compute seconds and modelled network seconds as SEPARATE
# columns. The modelled column is not `measured` (CLAUDE.md §2) and is never summed into a
# measured number without a label saying so.

# M6a. A representative, illustrative delay for the "modelled network seconds" column
# (docs/EXPERIMENTS.md Target 3, DEV-21's 4d-per-block / 3d-inside-consensus formula). DECLARED,
# not measured and not the value the timed runs above use (those stay at chain.yaml's
# consensus.message_delay_s, default 0.0 — see the long comment above). Picking a delay here does
# not change any measured number; it only says which delay the modelled column illustrates.
# 10ms is one same-datacenter LAN hop, a plausible floor for a real deployment; swept alongside
# 1ms (near-instant, same-rack) and 50ms (WAN / a telehealth link) so the reader sees the column
# scale rather than trusting one arbitrary pick.
network:
  modelled_delay_s: 0.01
  modelled_delay_sweep_s: [0.001, 0.01, 0.05]
  # DECLARED — D3 (closed). `chain.yaml`'s `consensus.serialize_messages` defaults OFF so
  # `make test` stays on the fast, unserialised bus; bench runs override it ON here, so Figs.
  # 6(a)-(d) pay the real encode/decode cost through `util.serialization` instead of carrying
  # DEV-30's estimate as an unpriced caveat. `bench.harness.BenchPolicy.from_config` applies this.
  serialize_messages: true

derived:
  # DEV-08. TPS is arithmetic on the timing above, never a separately measured quantity:
  #   tps = total_transactions / total_seconds
  # This matches how the paper's own six TPS values were produced (verified in EXPERIMENTS.md).
  tps: true
  # The paper's rising TPS is fixed-cost amortisation, not a throughput gain. Per-block marginal
  # cost is reported alongside it and should be roughly flat.
  marginal_cost_per_block: true

output:
  tables_dir: results/tables
  figures_dir: results/figures
  logs_dir: results/logs
  # Every emitted number carries one of exactly two labels and no third category (CLAUDE.md §2).
  number_labels: [measured, paper_reported]
  # Sidecar JSON written next to every table and figure. Without config_hash and seed a number
  # is not reproducible and therefore not publishable.
  #
  # config_hash_scheme records *how* the digest was built, not what it covers. M2a moved
  # config_hash() into crypto.hashing and domain-separated the pre-image, so every config digest
  # changed value on 2026-09-11 without any config file changing. Comparing hashes across that
  # boundary without the scheme would read a version difference as config drift.
  sidecar_fields:
    - run_id
    - config_hash
    - config_hash_scheme
    - seed
    - git_rev
    - host
    - cpu
    - python_version
    - platform
    - started_at
    - wall_seconds

reporting:
  # DEV-13 — absolute seconds will not match Java on 2019 hardware. The reproduction claim is
  # about shape: monotone increase, concavity, and the BC_SigRW > BC_DTBU gap.
  compare: [ratios, trend_shape]
  expected_properties:
    time_monotone_increasing: true
    time_sublinear_in_blocks: true
    sigrw_slower_than_dtbu: true
